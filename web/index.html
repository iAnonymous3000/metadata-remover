<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metadata Remover - Privacy-First File Cleaning</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Metadata Remover</h1>
            <p class="tagline">Remove metadata from files entirely in your browser. No uploads. No servers. Complete privacy.</p>
        </header>

        <main>
            <div id="drop-zone" class="drop-zone">
                <div class="drop-zone-content">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <p>Drop files here or <label for="file-input" class="file-label">browse</label></p>
                    <p class="supported">Supports: JPEG, PNG, PDF</p>
                    <input type="file" id="file-input" multiple accept=".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf">
                </div>
            </div>

            <div id="file-list" class="file-list"></div>

            <div id="actions" class="actions hidden">
                <button id="process-btn" class="btn btn-primary">Remove All Metadata</button>
                <button id="clear-btn" class="btn btn-secondary">Clear All</button>
            </div>
        </main>

        <footer>
            <div class="privacy-note">
                <svg class="icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <span>Files are processed locally using WebAssembly. Nothing leaves your device.</span>
            </div>
        </footer>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Metadata Details</h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>

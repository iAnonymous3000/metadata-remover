name: Build and Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BINARYEN_VERSION: 129
      BINARYEN_SHA256: 50b9fa62b9abea752da92ec57e0c555fee578760cd237c40107957715d2976ba
      WASM_PACK_VERSION: 0.14.0
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm/target
          key: ${{ runner.os }}-cargo-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('wasm/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Binaryen
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/binaryen.tar.gz"
          install_dir="$RUNNER_TEMP/binaryen"
          curl -fsSL \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            -o "$archive"
          echo "${BINARYEN_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          "$install_dir/bin/wasm-opt" --version

      - name: Install wasm-pack
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Format Rust
        working-directory: ./wasm
        run: cargo fmt --check

      - name: Test Rust
        working-directory: ./wasm
        run: cargo test --locked

      - name: Lint Rust
        working-directory: ./wasm
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Audit Rust dependencies
        working-directory: ./wasm
        run: cargo audit --deny warnings

      - name: Check deterministic WASM build
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/wasm-determinism"
          rm -rf "$scratch" web/wasm wasm/pkg
          mkdir -p "$scratch"

          npm run build
          cp web/wasm/metadata_remover_bg.wasm "$scratch/first.wasm"

          rm -rf web/wasm wasm/pkg
          npm run build
          cmp "$scratch/first.wasm" web/wasm/metadata_remover_bg.wasm

          {
            echo "### WASM determinism"
            echo
            echo "Built twice with rustc $(rustc --version), wasm-pack ${WASM_PACK_VERSION}, and Binaryen ${BINARYEN_VERSION}."
            echo
            echo '```'
            sha256sum web/wasm/metadata_remover_bg.wasm
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test JavaScript
        run: npm test

      - name: Build site
        run: npm run dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

[package]
name = "metadata-remover"
version = "0.1.0"
edition = "2021"
description = "Privacy-focused metadata removal for files"
license = "MIT"
repository = "https://github.com/user/metadata-remover"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
lopdf = "0.34"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
